[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "akasha-model"
version = "0.2.0"
description = "One-pass typed decision model for Akasha OS: Choice, Score and Noul."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Minimal Labs"}]
dependencies = ["numpy>=1.26", "torch>=2.2"]

[project.optional-dependencies]
transformers = ["transformers>=4.45"]
eval = ["datasets>=3"]
dev = ["pytest>=8"]
games = [
  "chess>=1.11",
  "imageio>=2.37",
  "imageio-ffmpeg>=0.6",
  "pillow>=11",
  "vizdoom>=1.2.4",
]

[project.scripts]
akasha-data = "akasha_model.data:main"
akasha-train = "akasha_model.train:main"
akasha-eval = "akasha_model.eval:main"
akasha-predict = "akasha_model.predict:main"
akasha-calibrate = "akasha_model.calibration:main"
akasha-ensemble-eval = "akasha_model.ensemble:main"
akasha-ensemble-predict = "akasha_model.ensemble:predict_main"
akasha-multitask-train = "akasha_model.multitask_train:main"
akasha-multitask-eval = "akasha_model.multitask_eval:main"
akasha-multitask-calibrate = "akasha_model.multitask_calibrate:main"
akasha-rlcd-train = "akasha_model.rlcd:main"
akasha-typed-eval = "akasha_model.typed_decisions:main"

[tool.setuptools.packages.find]
include = ["akasha_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
