name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install package (CPU torch)
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e '.[dev]'

      - name: pytest
        run: |
          source .venv/bin/activate
          pytest -q

      - name: Gate demo (no side effects)
        run: |
          source .venv/bin/activate
          python examples/gate/demo.py

  games:
    name: games-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install package with games extras (CPU torch)
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e '.[dev,games]'

      - name: Doom smoke
        run: |
          source .venv/bin/activate
          PYTHONPATH=examples/doom pytest -q examples/doom/test_smoke.py

      - name: Chess smoke
        run: |
          source .venv/bin/activate
          cd examples/chess && python test_smoke.py
