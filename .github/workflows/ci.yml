name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install package
        run: |
          uv venv
          uv pip install -e '.[dev]'

      - name: pytest
        run: .venv/bin/pytest -q

      - name: Gate demo (no side effects)
        run: .venv/bin/python examples/gate/demo.py

  games:
    name: games-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install package with games extras
        run: |
          uv venv
          uv pip install -e '.[dev,games]'

      - name: Doom smoke
        run: |
          PYTHONPATH=examples/doom .venv/bin/pytest -q examples/doom/test_smoke.py

      - name: Chess smoke
        run: .venv/bin/python examples/chess/test_smoke.py
