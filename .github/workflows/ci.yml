name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-lite:
    name: gate-lite (no torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Path A only
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python python
          uv pip install -e ".[dev]"
          .venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"

      - name: Path A pytest
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          .venv/bin/pytest -q tests/test_gate_path_a.py

      - name: Gate / host / outcomes demos (no torch)
        run: |
          .venv/bin/python examples/usage/demo.py
          .venv/bin/python examples/usage/visual_demo.py --out examples/usage/out/demo.html
          test -s examples/usage/out/demo.html
          grep -q '"status":"ready"' examples/usage/out/demo.html
          grep -q '"status":"blocked"' examples/usage/out/demo.html
          grep -q '"status":"abstain"' examples/usage/out/demo.html
          .venv/bin/python examples/gate/demo.py
          .venv/bin/python examples/gate/host_demo.py
          .venv/bin/python examples/gate/outcomes_demo.py --log data/gate/outcomes-ci.jsonl
          PYTHONPATH=examples/tetris .venv/bin/pytest -q examples/tetris/test_smoke.py
          .venv/bin/python examples/tetris/play.py --out examples/tetris/out/demo.html --pieces 8
          test -s examples/tetris/out/demo.html
          grep -q 'path_a_heuristic' examples/tetris/out/demo.html
          grep -q 'realtime_gravity' examples/tetris/out/demo.html
          grep -q '"status":"locked"' examples/tetris/out/demo.html
          grep -q '"kind":"fall"' examples/tetris/out/demo.html

  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install package with torch
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv --version
          uv venv --python python
          uv pip install -e ".[dev,torch]"

      - name: pytest
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          .venv/bin/pytest -q

      - name: First-run usage demo (Path A)
        run: |
          .venv/bin/python examples/usage/demo.py
          .venv/bin/python examples/usage/visual_demo.py --out examples/usage/out/demo.html
          test -s examples/usage/out/demo.html

      - name: Tetris realtime demo (Path A)
        run: |
          PYTHONPATH=examples/tetris .venv/bin/pytest -q examples/tetris/test_smoke.py
          .venv/bin/python examples/tetris/play.py --out examples/tetris/out/demo.html --pieces 8
          test -s examples/tetris/out/demo.html
          grep -q 'path_a_heuristic' examples/tetris/out/demo.html
          grep -q 'realtime_gravity' examples/tetris/out/demo.html
          grep -q '"kind":"fall"' examples/tetris/out/demo.html

      - name: Gate demo (no side effects)
        run: .venv/bin/python examples/gate/demo.py

      - name: Scored gate demo (committed tiny checkpoint)
        run: .venv/bin/python examples/gate/scored_demo.py --checkpoint examples/gate/checkpoints/gate-tiny.pt

      - name: Host dispatch demo (fake side effects)
        run: .venv/bin/python examples/gate/host_demo.py

      - name: Outcomes calibration demo
        run: .venv/bin/python examples/gate/outcomes_demo.py --log data/gate/outcomes-ci.jsonl

  rust-gate:
    name: rust-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test akasha-gate
        run: cargo test -p akasha-gate

      - name: FFI cdylib ctypes smoke
        run: |
          cargo build -p akasha-gate
          python3 crates/akasha-gate/scripts/ffi_ctypes_smoke.py

  games:
    name: games-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install package with games extras
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python python
          uv pip install -e ".[dev,games]"

      - name: Doom smoke
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          PYTHONPATH=examples/doom .venv/bin/pytest -q examples/doom/test_smoke.py

      - name: Chess smoke
        run: .venv/bin/python examples/chess/test_smoke.py
