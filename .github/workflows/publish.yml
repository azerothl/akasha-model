name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
  # Cursor/GitHub App tokens cannot workflow_dispatch (403) and release
  # events they create do not chain into new workflow runs. repository_dispatch
  # is allowed and is the agent-reachable trigger for the first PyPI upload.
  repository_dispatch:
    types: [publish-pypi]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
